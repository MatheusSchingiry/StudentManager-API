version: '3.8'

services:
  studentmanager-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studentmanager-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  
  postgres:
    image: postgres:14-alpine
    container_name: studentmanager-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  redis:
    image: redis:6.2-alpine
    container_name: studentmanager-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: